<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account Status</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background-color: #f8f9fa;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
">
    <div style="
        width: 85%;
        max-width: 400px;
        background: #ffffff;
        padding: 40px 24px;
        border-radius: 24px;
        text-align: center;
        box-shadow: 0 20px 40px rgba(18, 0, 47, 0.08);
    ">
        <!-- Optional: You could place a small icon here -->
        <div style="font-size: 48px; margin-bottom: 16px;">🗓️</div>

        <h2 style="
            color: #12002f; 
            margin: 0 0 12px 0; 
            font-size: 22px; 
            font-weight: 700;
            letter-spacing: -0.5px;
        ">
            Account Scheduled for Deletion
        </h2>
        
        <p style="
            color: #4b5563; 
            font-size: 16px; 
            line-height: 1.6; 
            margin-bottom: 24px;
        ">
            Your profile and event history will be permanently removed in <strong>7 days</strong>.
        </p>

        <div style="
            background: #f1f3f9;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 30px;
        ">
            <p style="color: #6b7280; font-size: 13px; margin: 0;">
                Changed your mind? Just log back in anytime before the deadline to keep your account.
            </p>
        </div>

        <button onclick="window.location.reload()" style="
            background-color: #12002f;
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: opacity 0.2s;
        ">
            Return to Login
        </button>
    </div>
</body>
</html>
